[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-vision-vs-sf2"
version = "0.1.0"
description = "laya-vision plays SNES Street Fighter II in Mesen (System 1: laya-vision + text laya), and Qwen learns from its games and writes the advice it follows (System 2)"
requires-python = ">=3.11"
# The emulator is Mesen 2 (a separate app); mesen/sf2_bridge.lua connects it to Python over a local socket.
dependencies = [
    "numpy",
    "pillow",
]

[project.optional-dependencies]
# The model side. laya-vision is not on PyPI; install it pinned (see README).
model = ["torch>=2.3", "torchvision", "transformers>=4.45", "safetensors", "huggingface_hub"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["sf2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
